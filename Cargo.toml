[package]
name = "dontbrowse"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "A terminal browser: YouTube + articles, rendered beautifully"
license = "MIT"

[lib]
name = "dontbrowse"
path = "src/lib.rs"

[[bin]]
name = "dontbrowse"
path = "src/main.rs"

[features]
default = []

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cookie = "0.18.2"
cookie_store = "0.22.1"
crossterm = { version = "0.29.0", features = ["event-stream", "osc52"] }
dirs = "7.0.0"
dom_smoothie = "0.19.0"
encoding_rs = "0.8.44"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
quick-xml = "0.42.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
reqwest = { version = "0.13.5", features = ["cookies", "gzip", "brotli", "json"] }
reqwest_cookie_store = "0.10.0"
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde", "local-offset"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "net", "fs", "io-util", "signal"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util", "rt", "macros"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
